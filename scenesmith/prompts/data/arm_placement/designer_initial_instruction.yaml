name: "arm_placement_designer_initial_instruction"
version: "1.0"
description: "Initial instruction for designer to place the arm"
template_variables: []
prompt: |
  Place the robot arm in this scene for the first time.

  Follow this workflow:
  1. Call observe_scene() to see the current layout
  2. Call get_scene_info() to understand the room and furniture
  3. Call list_placement_surfaces() to find candidate surfaces
  4. Choose the best surface based on placement guidelines
  5. Call place_arm() with appropriate surface, offsets, and rotation
  6. Call observe_scene() to verify the placement looks good

  Consider which surface gives the arm the best combination of:
  - Stability (flat, sturdy, large enough for base)
  - Reachability (objects nearby to manipulate)
  - Clearance (room for arm movement)
  - Task suitability (makes sense for the room type)

  When complete, summarize your placement decision and reasoning.
