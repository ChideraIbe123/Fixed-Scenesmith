name: "arm_placement_planner_runner_instruction"
version: "1.1"
description: "Entry message for the arm placement planner"
template_variables: ["task_prompt"]
prompt: |
  Place the robot arm in this scene. Follow the workflow:
  1. Call request_initial_design() to have the designer analyze the scene and place the arm
  2. Call request_critique() to evaluate the placement
  3. If needed, use request_design_change() to address feedback
  4. Repeat critique/change cycles until scores are high or max rounds reached

  {% if task_prompt %}
  USER TASK: {{ task_prompt }}
  The arm placement MUST satisfy this request. Pass this requirement to the designer.
  {% endif %}

  Start by calling request_initial_design().
