<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
            "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.6/src/URDFLoader.js"
        }
    }
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 56px;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #fff;
        }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header-btn {
            padding: 8px 16px;
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }
        .header-btn:hover { border-color: #555; color: #fff; }
        .header-btn.active { background: #fff; color: #0a0a0a; border-color: #fff; }

        /* Robot upload modal */
        #robot-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }
        #robot-modal.open { display: flex; }
        .modal-box {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 32px;
            width: 420px;
            max-width: 90vw;
        }
        .modal-box h2 {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            margin-bottom: 20px;
        }
        .upload-group {
            margin-bottom: 16px;
        }
        .upload-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
        }
        .upload-group input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px 12px;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ccc;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
        }
        .upload-group input[type="file"]::file-selector-button {
            background: #222;
            color: #ccc;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 4px 12px;
            margin-right: 12px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal-actions .btn { flex: 1; }
        .btn-ghost {
            background: #1a1a1a;
            color: #888;
            border: 1px solid #2a2a2a;
        }
        .btn-ghost:hover { background: #222; color: #ccc; }
        #robot-status {
            margin-top: 12px;
            font-size: 12px;
            color: #666;
            min-height: 18px;
        }

        .layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
        }
        .sidebar label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
        }
        .sidebar textarea {
            flex: 1;
            min-height: 120px;
            max-height: 300px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 12px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        .sidebar textarea:focus { border-color: #555; }
        .sidebar textarea:disabled { opacity: 0.4; cursor: not-allowed; }
        .image-upload-row { display: flex; align-items: center; gap: 8px; }
        .img-upload-btn {
            font-size: 12px; font-weight: 500; color: #888;
            cursor: pointer; padding: 6px 12px;
            background: #111; border: 1px dashed #2a2a2a; border-radius: 6px;
            transition: border-color 0.2s, color 0.2s;
        }
        .img-upload-btn:hover { border-color: #555; color: #ccc; }
        .img-count { font-size: 11px; color: #666; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            background: #fff;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn:hover { background: #ddd; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* Main content area */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .welcome { text-align: center; color: #444; }
        .welcome h2 { font-size: 32px; font-weight: 300; margin-bottom: 8px; color: #555; }
        .welcome p { font-size: 14px; }

        .progress-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            width: 100%;
            max-width: 640px;
            padding: 24px;
        }

        .stage-bar { display: flex; gap: 4px; width: 100%; }
        .stage-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .stage-step .bar { height: 3px; width: 100%; background: #222; border-radius: 2px; transition: background 0.4s; }
        .stage-step.active .bar { background: #fff; }
        .stage-step.completed .bar { background: #666; }
        .stage-step .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #444; transition: color 0.4s; }
        .stage-step.active .label { color: #fff; }
        .stage-step.completed .label { color: #666; }
        .elapsed { font-size: 48px; font-weight: 300; color: #333; font-variant-numeric: tabular-nums; }
        .preview-img { max-width: 100%; max-height: 320px; border-radius: 8px; border: 1px solid #2a2a2a; }

        .log-tail {
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 11px;
            color: #555;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Three.js viewer */
        #viewer-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #viewer-container canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        #loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #555;
            font-size: 14px;
            z-index: 10;
        }
        .spinner {
            width: 24px; height: 24px;
            border: 2px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Right detail panel */
        #detail-panel {
            width: 360px;
            flex-shrink: 0;
            border-left: 1px solid #2a2a2a;
            background: #0d0d0d;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        #detail-panel.open { display: flex; }

        #detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
        }
        #detail-header h3 {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        #detail-close {
            width: 28px; height: 28px;
            background: none;
            border: 1px solid #333;
            border-radius: 6px;
            color: #888;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-left: 12px;
        }
        #detail-close:hover { border-color: #555; color: #fff; }

        #detail-viewer {
            width: 100%;
            height: 300px;
            flex-shrink: 0;
            position: relative;
            background: #111;
        }
        #detail-viewer canvas { display: block; width: 100%; height: 100%; }

        #detail-props {
            padding: 16px 20px;
            overflow-y: auto;
            flex: 1;
        }
        .prop-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 13px;
        }
        .prop-label { color: #666; }
        .prop-value { color: #ccc; text-align: right; }

        .error-msg { text-align: center; color: #ff4444; font-size: 14px; max-width: 480px; }
        .error-msg h3 { margin-bottom: 8px; font-weight: 500; }
        .error-msg p { color: #aa3333; }

        /* Transform toolbar */
        #transform-toolbar {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
            border-bottom: 1px solid #2a2a2a;
        }
        .tf-btn {
            flex: 1;
            padding: 6px 0;
            background: #1a1a1a;
            color: #888;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tf-btn:hover { border-color: #555; color: #ccc; }
        .tf-btn.active { background: #fff; color: #0a0a0a; border-color: #fff; }

        /* Transform inputs */
        .transform-section { padding: 12px 16px; border-bottom: 1px solid #1a1a1a; }
        .transform-section .ts-label {
            font-size: 10px; font-weight: 600; letter-spacing: 1px;
            text-transform: uppercase; color: #666; margin-bottom: 6px;
        }
        .transform-row { display: flex; gap: 4px; }
        .transform-row label {
            display: flex; align-items: center; gap: 2px; flex: 1;
            font-size: 11px; font-weight: 500;
        }
        .transform-row label .axis { width: 14px; text-align: center; }
        .transform-row label .axis-x { color: #e55; }
        .transform-row label .axis-y { color: #5e5; }
        .transform-row label .axis-z { color: #58f; }
        .transform-row input {
            width: 100%; padding: 4px 6px;
            background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 4px;
            color: #ccc; font-family: 'JetBrains Mono', monospace; font-size: 11px;
            outline: none;
        }
        .transform-row input:focus { border-color: #555; }
    </style>
</head>
<body>
    <header>
        <h1>TALIK</h1>
        <div class="header-actions">
            <button class="header-btn" id="editToggleBtn" onclick="toggleEditMode()">Edit Mode</button>
            <button class="header-btn" id="addRobotBtn" onclick="openRobotModal()">+ Add Robot</button>
        </div>
    </header>

    <!-- Robot upload modal -->
    <div id="robot-modal">
        <div class="modal-box">
            <h2>Add Robot</h2>
            <div class="upload-group">
                <label>URDF File</label>
                <input type="file" id="urdfFile" accept=".urdf,.xacro,.xml">
            </div>
            <div class="upload-group">
                <label>STL Mesh Files</label>
                <input type="file" id="stlFiles" accept=".stl" multiple>
            </div>
            <div id="robot-status"></div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeRobotModal()">Cancel</button>
                <button class="btn" id="uploadRobotBtn" onclick="uploadRobot()">Upload & Load</button>
            </div>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <label>Scene Prompt</label>
            <textarea id="prompt" placeholder="Describe your scene...&#10;&#10;e.g. A cozy kitchen with a wooden table, two chairs, and warm lighting"></textarea>
            <div class="image-upload-row">
                <label for="refImages" class="img-upload-btn">+ Reference Images</label>
                <input type="file" id="refImages" accept="image/*" multiple style="display:none" onchange="updateImageCount()">
                <span id="imageCount" class="img-count"></span>
            </div>
            <button class="btn" id="generateBtn" onclick="generate()">Generate</button>
            <button class="btn" id="cancelBtn" onclick="cancelJob()" style="display:none;background:#1a1a1a;color:#ff4444;border:1px solid #332222">Cancel</button>
            <button class="btn" id="variationBtn" onclick="generateVariation()" style="display:none;background:#1a1a1a;color:#ccc;border:1px solid #2a2a2a">Generate Variation</button>
            <button class="btn" id="loadBtn" onclick="loadExisting()" style="background:#1a1a1a;color:#888;font-size:12px;padding:8px 12px;margin-top:auto">Load Existing Scene</button>
        </aside>

        <main class="main" id="mainArea">
            <div class="welcome" id="stateIdle">
                <h2>Talik</h2>
                <p>Enter a prompt and generate a 3D scene</p>
            </div>

            <div class="progress-container" id="stateRunning" style="display:none">
                <div class="stage-bar" id="stageBar"></div>
                <div class="elapsed" id="elapsed">0:00</div>
                <img class="preview-img" id="previewImg" style="display:none" alt="Scene preview">
                <div class="log-tail" id="logTail"></div>
            </div>

            <div id="stateDone" style="display:none;width:100%;height:100%">
                <div id="viewer-container">
                    <div id="loading-overlay">
                        <div class="spinner"></div>
                        Loading 3D scene...
                    </div>
                </div>
            </div>

            <div class="error-msg" id="stateError" style="display:none">
                <h3>Generation Failed</h3>
                <p id="errorText"></p>
            </div>
        </main>

        <!-- Right detail panel -->
        <div id="detail-panel">
            <div id="detail-header">
                <h3 id="detail-name">Object</h3>
                <button id="detail-close" onclick="closeDetail()">&times;</button>
            </div>
            <div id="transform-toolbar">
                <button class="tf-btn active" data-mode="translate" onclick="setTransformMode('translate')">Move (G)</button>
                <button class="tf-btn" data-mode="rotate" onclick="setTransformMode('rotate')">Rotate (R)</button>
                <button class="tf-btn" data-mode="scale" onclick="setTransformMode('scale')">Scale (S)</button>
            </div>
            <div id="detail-viewer"></div>
            <div id="detail-props"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import URDFLoader from 'urdf-loader';

        // ---- Main viewer ----
        let renderer, scene, camera, controls;
        let transformControls = null;
        let transformHelper = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let selectedObject = null;
        let originalMaterials = new Map();
        let editMode = false;

        // ---- Detail viewer ----
        let detailRenderer, detailScene, detailCamera, detailControls;
        let detailInited = false;

        function initViewer() {
            const container = document.getElementById('viewer-container');

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x0a0a0a);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.5;
            container.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
            camera.position.set(10, 10, 10);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.target.set(0, 0, 0);
            controls.update();

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const hemi = new THREE.HemisphereLight(0xffffff, 0x888888, 1.0);
            hemi.position.set(0, 20, 0);
            scene.add(hemi);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(8, 15, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(4096, 4096);
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            dirLight.shadow.bias = -0.0005;
            dirLight.shadow.normalBias = 0.02;
            scene.add(dirLight);

            scene.add(new THREE.DirectionalLight(0xffffff, 0.8).translateX(-5).translateY(8).translateZ(-5));
            scene.add(new THREE.DirectionalLight(0xffffff, 0.5).translateY(12).translateZ(-8));

            // Transform controls for moving/rotating/scaling objects
            transformControls = new TransformControls(camera, renderer.domElement);
            transformControls.addEventListener('dragging-changed', (event) => {
                controls.enabled = !event.value;
            });
            transformControls.addEventListener('objectChange', () => {
                // Sync the detail panel inputs when gizmo is dragged
                if (!selectedObject) return;
                const p = selectedObject.position;
                const r = selectedObject.rotation;
                const s = selectedObject.scale;
                const updates = {
                    'pos-x': p.x, 'pos-y': p.y, 'pos-z': p.z,
                    'rot-x': r.x*180/Math.PI, 'rot-y': r.y*180/Math.PI, 'rot-z': r.z*180/Math.PI,
                    'scl-x': s.x, 'scl-y': s.y, 'scl-z': s.z,
                };
                for (const [key, val] of Object.entries(updates)) {
                    const inp = document.querySelector(`input[data-prop="${key}"]`);
                    if (inp && inp !== document.activeElement) inp.value = val.toFixed(3);
                }
            });
            transformHelper = transformControls.getHelper();
            transformHelper.name = '__TransformHelper__';
            scene.add(transformHelper);

            handleResize();
            window.addEventListener('resize', handleResize);
            renderer.domElement.addEventListener('click', onViewerClick);

            // Keyboard shortcuts for transform modes
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                switch (e.key.toLowerCase()) {
                    case 'g': if (editMode) window.setTransformMode('translate'); break;
                    case 'r': if (editMode) window.setTransformMode('rotate'); break;
                    case 's': if (editMode) window.setTransformMode('scale'); break;
                    case 'e': window.toggleEditMode(); break;
                    case 'escape': detachTransform(); window.closeDetail(); break;
                }
            });

            animate();
        }

        window.toggleEditMode = function() {
            editMode = !editMode;
            const btn = document.getElementById('editToggleBtn');
            btn.classList.toggle('active', editMode);
            if (!editMode) {
                detachTransform();
                // Hide transform toolbar and inputs in detail panel
                const toolbar = document.getElementById('transform-toolbar');
                if (toolbar) toolbar.style.display = 'none';
                document.querySelectorAll('.transform-section').forEach(s => s.style.display = 'none');
            } else {
                // Re-attach to selected object if any
                if (selectedObject && transformControls) {
                    transformControls.attach(selectedObject);
                }
                const toolbar = document.getElementById('transform-toolbar');
                if (toolbar) toolbar.style.display = '';
                document.querySelectorAll('.transform-section').forEach(s => s.style.display = '');
            }
        };

        window.setTransformMode = function(mode) {
            if (!transformControls) return;
            transformControls.setMode(mode);
            // Sync toolbar buttons
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        };

        function initDetailViewer() {
            if (detailInited) return;
            detailInited = true;

            const container = document.getElementById('detail-viewer');
            detailRenderer = new THREE.WebGLRenderer({ antialias: true });
            detailRenderer.setPixelRatio(window.devicePixelRatio);
            detailRenderer.setClearColor(0x111111);
            detailRenderer.shadowMap.enabled = true;
            detailRenderer.shadowMap.type = THREE.PCFSoftShadowMap;
            detailRenderer.toneMapping = THREE.ACESFilmicToneMapping;
            detailRenderer.toneMappingExposure = 1.5;
            container.appendChild(detailRenderer.domElement);

            detailScene = new THREE.Scene();
            detailCamera = new THREE.PerspectiveCamera(45, 1, 0.01, 200);

            detailControls = new OrbitControls(detailCamera, detailRenderer.domElement);
            detailControls.enableDamping = true;
            detailControls.dampingFactor = 0.08;
            detailControls.autoRotate = true;
            detailControls.autoRotateSpeed = 2.0;

            // Lighting for detail view
            detailScene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const dh = new THREE.HemisphereLight(0xffffff, 0x888888, 0.8);
            dh.position.set(0, 10, 0);
            detailScene.add(dh);

            const dd1 = new THREE.DirectionalLight(0xffffff, 1.8);
            dd1.position.set(3, 5, 4);
            dd1.castShadow = true;
            dd1.shadow.mapSize.set(2048, 2048);
            detailScene.add(dd1);

            const dd2 = new THREE.DirectionalLight(0xffffff, 0.6);
            dd2.position.set(-3, 4, -2);
            detailScene.add(dd2);

            handleDetailResize();
        }

        function handleResize() {
            const container = document.getElementById('viewer-container');
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w === 0 || h === 0) return;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function handleDetailResize() {
            if (!detailRenderer) return;
            const container = document.getElementById('detail-viewer');
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w === 0 || h === 0) return;
            detailCamera.aspect = w / h;
            detailCamera.updateProjectionMatrix();
            detailRenderer.setSize(w, h);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);

            if (detailRenderer && detailScene && detailCamera) {
                detailControls.update();
                detailRenderer.render(detailScene, detailCamera);
            }
        }

        // ---- Object picking ----

        function getObjectName(node) {
            let n = node;
            while (n) {
                if (n.name && n.name !== '' && !n.name.startsWith('Scene') && !n.name.startsWith('RootNode')) {
                    return n.name;
                }
                n = n.parent;
            }
            return node.name || 'Unnamed';
        }

        function getTopLevelGroup(mesh) {
            let node = mesh;
            while (node && node.parent) {
                if (node.parent === scene || node.parent.type === 'Scene' ||
                    (node.parent.name && (node.parent.name.startsWith('Scene') || node.parent.name.startsWith('RootNode')))) {
                    return node;
                }
                node = node.parent;
            }
            return mesh;
        }

        function detachTransform() {
            if (transformControls && transformControls.object) {
                transformControls.detach();
            }
        }

        function clearSelection() {
            detachTransform();
            if (selectedObject) {
                selectedObject.traverse(child => {
                    if (child.isMesh && originalMaterials.has(child)) {
                        child.material = originalMaterials.get(child);
                    }
                });
                originalMaterials.clear();
                selectedObject = null;
            }
        }

        function selectObject(mesh) {
            const group = getTopLevelGroup(mesh);
            if (selectedObject === group) return;

            clearSelection();
            selectedObject = group;

            // Attach transform controls only in edit mode
            if (editMode && transformControls) {
                transformControls.attach(group);
            }

            // Open detail panel BEFORE highlighting so the clone gets original materials
            openDetailPanel(group);

            // Highlight in main scene only in edit mode
            if (editMode) {
                group.traverse(child => {
                    if (child.isMesh) {
                        originalMaterials.set(child, child.material);
                        const mat = child.material.clone();
                        mat.emissive = new THREE.Color(0x1a3a5c);
                        mat.emissiveIntensity = 0.4;
                        child.material = mat;
                    }
                });
            }
        }

        function openDetailPanel(group) {
            initDetailViewer();

            const panel = document.getElementById('detail-panel');
            panel.classList.add('open');

            // Name
            const name = getObjectName(group).replace(/_/g, ' ');
            document.getElementById('detail-name').textContent = name;

            // Clone the object into detail scene
            // Clear previous
            const toRemove = [];
            detailScene.traverse(c => { if (c.isMesh) toRemove.push(c); });
            toRemove.forEach(m => { m.parent.remove(m); });

            const clone = group.clone(true);

            // Reset clone to origin — compute its world bounding box, then offset
            const worldBox = new THREE.Box3().setFromObject(group);
            const worldCenter = worldBox.getCenter(new THREE.Vector3());

            // Get the clone's own position offset to center it
            clone.position.set(0, 0, 0);
            clone.updateMatrixWorld(true);
            const cloneBox = new THREE.Box3().setFromObject(clone);
            const cloneCenter = cloneBox.getCenter(new THREE.Vector3());
            clone.position.sub(cloneCenter);

            // Enable shadows on clone
            clone.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            detailScene.add(clone);

            // Fit detail camera
            clone.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(clone);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const dist = maxDim * 2.0;

            detailControls.target.set(0, 0, 0);
            detailCamera.position.set(dist * 0.6, dist * 0.5, dist * 0.6);
            detailCamera.near = maxDim * 0.005;
            detailCamera.far = maxDim * 20;
            detailCamera.updateProjectionMatrix();
            detailControls.update();

            // Update detail shadow light
            const dl = detailScene.children.find(c => c.isDirectionalLight && c.castShadow);
            if (dl) {
                const pad = maxDim * 1.0;
                dl.position.set(maxDim, maxDim * 1.5, maxDim);
                dl.shadow.camera.left = -pad;
                dl.shadow.camera.right = pad;
                dl.shadow.camera.top = pad;
                dl.shadow.camera.bottom = -pad;
                dl.shadow.camera.near = 0.01;
                dl.shadow.camera.far = maxDim * 6;
                dl.shadow.camera.updateProjectionMatrix();
            }

            // Properties
            const props = document.getElementById('detail-props');
            let meshCount = 0;
            let triCount = 0;
            group.traverse(c => {
                if (c.isMesh) {
                    meshCount++;
                    const geo = c.geometry;
                    triCount += geo.index ? geo.index.count / 3 : geo.attributes.position.count / 3;
                }
            });
            triCount = Math.round(triCount);

            const pos = group.position;
            const rot = group.rotation;
            const scl = group.scale;

            const mkRow = (label, axis, val, onChange) =>
                `<label><span class="axis axis-${axis}">${axis.toUpperCase()}</span><input type="number" step="0.01" value="${val.toFixed(3)}" data-prop="${label}-${axis}"></label>`;

            props.innerHTML = `
                <div class="transform-section">
                    <div class="ts-label">Position</div>
                    <div class="transform-row" data-transform="position">
                        ${mkRow('pos','x',pos.x)}${mkRow('pos','y',pos.y)}${mkRow('pos','z',pos.z)}
                    </div>
                </div>
                <div class="transform-section">
                    <div class="ts-label">Rotation (deg)</div>
                    <div class="transform-row" data-transform="rotation">
                        ${mkRow('rot','x',rot.x*180/Math.PI)}${mkRow('rot','y',rot.y*180/Math.PI)}${mkRow('rot','z',rot.z*180/Math.PI)}
                    </div>
                </div>
                <div class="transform-section">
                    <div class="ts-label">Scale</div>
                    <div class="transform-row" data-transform="scale">
                        ${mkRow('scl','x',scl.x)}${mkRow('scl','y',scl.y)}${mkRow('scl','z',scl.z)}
                    </div>
                </div>
                <div class="prop-row"><span class="prop-label">Dimensions</span><span class="prop-value">${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} m</span></div>
                <div class="prop-row"><span class="prop-label">Meshes</span><span class="prop-value">${meshCount}</span></div>
                <div class="prop-row"><span class="prop-label">Triangles</span><span class="prop-value">${triCount.toLocaleString()}</span></div>
            `;

            // Wire up inputs to update the object transform
            props.querySelectorAll('input[data-prop]').forEach(input => {
                input.addEventListener('change', () => {
                    const [type, axis] = input.dataset.prop.split('-');
                    const v = parseFloat(input.value);
                    if (isNaN(v)) return;
                    if (type === 'pos') group.position[axis] = v;
                    else if (type === 'rot') group.rotation[axis] = v * Math.PI / 180;
                    else if (type === 'scl') group.scale[axis] = v;
                });
            });

            // Hide transform controls when not in edit mode
            if (!editMode) {
                document.getElementById('transform-toolbar').style.display = 'none';
                props.querySelectorAll('.transform-section').forEach(s => s.style.display = 'none');
            }

            // Resize both viewers after panel opens
            requestAnimationFrame(() => {
                handleResize();
                handleDetailResize();
            });
        }

        window.generateVariation = function() {
            // Randomize all lights in the main scene
            const rand = (lo, hi) => lo + Math.random() * (hi - lo);
            const randColor = () => {
                // Slight color tint — warm to cool
                const h = Math.random();
                const s = rand(0.05, 0.3);
                const l = rand(0.7, 1.0);
                return new THREE.Color().setHSL(h, s, l);
            };

            scene.traverse(child => {
                if (child.isAmbientLight) {
                    child.color.copy(randColor());
                    child.intensity = rand(0.5, 1.5);
                }
                if (child.isHemisphereLight) {
                    child.color.copy(randColor());
                    child.groundColor.copy(randColor().multiplyScalar(0.5));
                    child.intensity = rand(0.4, 1.4);
                }
                if (child.isDirectionalLight) {
                    child.color.copy(randColor());
                    child.intensity = rand(0.8, 3.0);
                    // Randomize position on a sphere around the scene center
                    const theta = rand(0, Math.PI * 2);
                    const phi = rand(0.3, 1.2); // keep above horizon
                    const r = rand(8, 20);
                    const target = child.target ? child.target.position : new THREE.Vector3();
                    child.position.set(
                        target.x + r * Math.sin(phi) * Math.cos(theta),
                        target.y + r * Math.cos(phi),
                        target.z + r * Math.sin(phi) * Math.sin(theta)
                    );
                    if (child.shadow && child.shadow.camera) {
                        child.shadow.camera.updateProjectionMatrix();
                    }
                }
            });

            // Also vary tone mapping exposure
            renderer.toneMappingExposure = rand(1.0, 2.2);
        };

        window.closeDetail = function() {
            clearSelection();
            document.getElementById('detail-panel').classList.remove('open');
            requestAnimationFrame(handleResize);
        };

        function onViewerClick(event) {
            // Don't pick while dragging the transform gizmo
            if (transformControls && transformControls.dragging) return;

            const container = document.getElementById('viewer-container');
            const rect = container.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            // Only raycast scene objects, skip transform gizmo helper
            const sceneObjects = scene.children.filter(c =>
                c.name !== '__TransformHelper__'
            );
            const intersects = raycaster.intersectObjects(sceneObjects, true);
            const hit = intersects.find(i => i.object.isMesh);
            if (hit) {
                selectObject(hit.object);
            } else {
                window.closeDetail();
            }
        }

        // ---- GLB loading ----

        function loadGLB(url) {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = 'flex';
            window.closeDetail();

            // Remove old scene meshes, but NOT the TransformControls gizmo
            const toRemove = [];
            scene.traverse(child => {
                if (child.isMesh) {
                    // Skip meshes belonging to the transform helper
                    let isGizmo = false;
                    let p = child;
                    while (p) {
                        if (p.name === '__TransformHelper__') { isGizmo = true; break; }
                        p = p.parent;
                    }
                    if (!isGizmo) toRemove.push(child);
                }
            });
            toRemove.forEach(m => {
                m.geometry.dispose();
                if (m.material.dispose) m.material.dispose();
                m.parent.remove(m);
            });

            const loader = new GLTFLoader();
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
            loader.setDRACOLoader(dracoLoader);

            loader.load(url, (gltf) => {
                const model = gltf.scene;
                model.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                scene.add(model);

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const dist = maxDim * 1.5;

                controls.target.copy(center);
                camera.position.set(center.x + dist * 0.7, center.y + dist * 0.5, center.z + dist * 0.7);
                camera.near = maxDim * 0.01;
                camera.far = maxDim * 10;
                camera.updateProjectionMatrix();
                controls.update();

                const dirLight = scene.children.find(c => c.isDirectionalLight && c.castShadow);
                if (dirLight) {
                    const pad = maxDim * 0.6;
                    dirLight.position.set(center.x + maxDim, center.y + maxDim * 1.2, center.z + maxDim);
                    dirLight.target.position.copy(center);
                    dirLight.target.updateMatrixWorld();
                    dirLight.shadow.camera.left = -pad;
                    dirLight.shadow.camera.right = pad;
                    dirLight.shadow.camera.top = pad;
                    dirLight.shadow.camera.bottom = -pad;
                    dirLight.shadow.camera.near = 0.1;
                    dirLight.shadow.camera.far = maxDim * 5;
                    dirLight.shadow.camera.updateProjectionMatrix();
                }

                overlay.style.display = 'none';
                handleResize();
            }, undefined, (err) => {
                console.error('GLB load error:', err);
                overlay.innerHTML = '<span style="color:#ff4444">Failed to load 3D scene</span>';
            });
        }

        window._loadGLB = loadGLB;
        window._initViewer = initViewer;
        window._viewerResize = handleResize;

        // ---- UI State Machine ----

        const STAGES = [
            { key: 'floor_plan', label: 'Floor Plan' },
            { key: 'furniture', label: 'Furniture' },
            { key: 'wall',      label: 'Walls' },
            { key: 'ceiling',   label: 'Ceiling' },
            { key: 'manipuland', label: 'Manipulands' },
            { key: 'done',      label: 'Done' },
        ];

        let pollTimer = null;
        let viewerInited = false;

        function buildStageBar() {
            const bar = document.getElementById('stageBar');
            bar.innerHTML = '';
            STAGES.forEach(s => {
                const step = document.createElement('div');
                step.className = 'stage-step';
                step.id = 'stage-' + s.key;
                step.innerHTML = `<div class="bar"></div><span class="label">${s.label}</span>`;
                bar.appendChild(step);
            });
        }

        function updateStageBar(currentStage) {
            let pastCurrent = false;
            STAGES.forEach(s => {
                const el = document.getElementById('stage-' + s.key);
                if (!el) return;
                el.classList.remove('active', 'completed');
                if (s.key === currentStage) {
                    el.classList.add('active');
                    pastCurrent = true;
                } else if (!pastCurrent) {
                    el.classList.add('completed');
                }
            });
        }

        function formatElapsed(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return m + ':' + String(s).padStart(2, '0');
        }

        function showState(state) {
            ['stateIdle', 'stateRunning', 'stateDone', 'stateError'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            const id = 'state' + state.charAt(0).toUpperCase() + state.slice(1);
            const el = document.getElementById(id);
            if (!el) return;
            if (state === 'running') el.style.display = 'flex';
            else el.style.display = '';

            document.getElementById('variationBtn').style.display = (state === 'done') ? '' : 'none';
            if (state === 'done') {
                if (!viewerInited) { viewerInited = true; window._initViewer(); }
                requestAnimationFrame(() => window._viewerResize());
            }
        }

        window.cancelJob = async function() {
            try {
                const res = await fetch('/api/cancel', { method: 'POST' });
                if (!res.ok) { const d = await res.json(); alert(d.detail || 'Failed to cancel'); }
            } catch (e) { console.error('Cancel error:', e); }
        };

        function setRunningUI(running) {
            document.getElementById('prompt').disabled = running;
            const genBtn = document.getElementById('generateBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            genBtn.disabled = running;
            genBtn.textContent = running ? 'Generating...' : 'Generate';
            cancelBtn.style.display = running ? '' : 'none';
        }

        window.generate = async function() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return;
            setRunningUI(true);
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt }),
                });
                if (!res.ok) { const d = await res.json(); alert(d.detail || 'Failed'); setRunningUI(false); return; }
            } catch (e) { alert('Network error: ' + e.message); setRunningUI(false); return; }
            buildStageBar();
            showState('running');
            startPolling();
        };

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(poll, 3000);
            poll();
        }

        async function poll() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                if (data.status === 'idle') return;
                if (data.status === 'running') {
                    showState('running');
                    updateStageBar(data.stage || 'floor_plan');
                    document.getElementById('elapsed').textContent = formatElapsed(data.elapsed);
                    const img = document.getElementById('previewImg');
                    if (data.preview_url) { img.src = data.preview_url + '?t=' + Date.now(); img.style.display = ''; }
                    const tail = document.getElementById('logTail');
                    if (data.log_tail) { tail.textContent = data.log_tail; tail.scrollTop = tail.scrollHeight; }
                    return;
                }
                clearInterval(pollTimer); pollTimer = null;
                if (data.status === 'done') {
                    showState('done');
                    window._loadGLB('/api/scene.glb?t=' + Date.now());
                    setRunningUI(false);
                    return;
                }
                if (data.status === 'error') {
                    showState('error');
                    document.getElementById('errorText').textContent = data.error || 'Unknown error';
                    setRunningUI(false);
                }
            } catch (e) { console.error('Poll error:', e); }
        }

        window.loadExisting = async function() {
            const btn = document.getElementById('loadBtn');
            btn.disabled = true; btn.textContent = 'Loading...';
            try {
                const res = await fetch('/api/load-existing', { method: 'POST' });
                const data = await res.json();
                if (res.ok && data.status === 'done') {
                    showState('done');
                    window._loadGLB('/api/scene.glb?t=' + Date.now());
                } else { alert(data.detail || 'Failed to load existing scene'); }
            } catch (e) { alert('Error: ' + e.message); }
            btn.disabled = false; btn.textContent = 'Load Existing Scene';
        };

        // ---- Robot upload ----

        window.openRobotModal = function() {
            document.getElementById('robot-modal').classList.add('open');
            document.getElementById('robot-status').textContent = '';
        };

        window.closeRobotModal = function() {
            document.getElementById('robot-modal').classList.remove('open');
        };

        window.uploadRobot = async function() {
            const urdfInput = document.getElementById('urdfFile');
            const stlInput = document.getElementById('stlFiles');
            const statusEl = document.getElementById('robot-status');
            const btn = document.getElementById('uploadRobotBtn');

            if (!urdfInput.files.length) {
                statusEl.textContent = 'Please select a URDF file';
                statusEl.style.color = '#ff4444';
                return;
            }
            if (!stlInput.files.length) {
                statusEl.textContent = 'Please select STL mesh files';
                statusEl.style.color = '#ff4444';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Uploading...';
            statusEl.textContent = 'Uploading robot files...';
            statusEl.style.color = '#888';

            const formData = new FormData();
            formData.append('urdf', urdfInput.files[0]);
            for (const f of stlInput.files) {
                formData.append('stl_files', f);
            }

            try {
                const res = await fetch('/api/upload-robot', {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();

                if (!res.ok) {
                    statusEl.textContent = data.detail || 'Upload failed';
                    statusEl.style.color = '#ff4444';
                    btn.disabled = false;
                    btn.textContent = 'Upload & Load';
                    return;
                }

                statusEl.textContent = 'Loading robot into scene...';
                closeRobotModal();
                loadRobotURDF(data.urdf_url);

            } catch (e) {
                statusEl.textContent = 'Error: ' + e.message;
                statusEl.style.color = '#ff4444';
            }
            btn.disabled = false;
            btn.textContent = 'Upload & Load';
        };

        function loadRobotURDF(urdfUrl) {
            // Ensure viewer is initialized
            if (!viewerInited) {
                viewerInited = true;
                window._initViewer();
                showState('done');
            }
            requestAnimationFrame(() => window._viewerResize());

            const loader = new URDFLoader();

            // The URDF references meshes with relative paths like "meshes/foo.stl"
            // urdf-loader resolves them relative to the URDF's directory
            // No package:// mapping needed since we rewrote them server-side

            loader.load(urdfUrl, (robot) => {
                robot.name = 'Robot';

                // Set material and shadows on all meshes
                robot.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        // STL meshes loaded by urdf-loader get a default Phong material
                        // Upgrade to a nicer PBR material
                        if (child.material && child.material.isMeshPhongMaterial) {
                            const pbr = new THREE.MeshStandardMaterial({
                                color: child.material.color || 0x444444,
                                metalness: 0.3,
                                roughness: 0.6,
                            });
                            child.material = pbr;
                        }
                    }
                });

                // Check if there's already a scene loaded
                let hasExistingScene = false;
                scene.traverse(c => { if (c.isMesh) hasExistingScene = true; });

                if (hasExistingScene) {
                    robot.position.copy(controls.target);
                }

                scene.add(robot);

                // Fit camera if robot is the only thing
                if (!hasExistingScene) {
                    const box = new THREE.Box3().setFromObject(robot);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const dist = maxDim * 2.5;

                    controls.target.copy(center);
                    camera.position.set(center.x + dist * 0.7, center.y + dist * 0.5, center.z + dist * 0.7);
                    camera.near = maxDim * 0.005;
                    camera.far = maxDim * 20;
                    camera.updateProjectionMatrix();
                    controls.update();

                    const dirLight = scene.children.find(c => c.isDirectionalLight && c.castShadow);
                    if (dirLight) {
                        const pad = maxDim * 1.5;
                        dirLight.position.set(center.x + maxDim, center.y + maxDim * 1.2, center.z + maxDim);
                        dirLight.target.position.copy(center);
                        dirLight.target.updateMatrixWorld();
                        dirLight.shadow.camera.left = -pad;
                        dirLight.shadow.camera.right = pad;
                        dirLight.shadow.camera.top = pad;
                        dirLight.shadow.camera.bottom = -pad;
                        dirLight.shadow.camera.near = 0.001;
                        dirLight.shadow.camera.far = maxDim * 8;
                        dirLight.shadow.camera.updateProjectionMatrix();
                    }
                }

                const overlay = document.getElementById('loading-overlay');
                if (overlay) overlay.style.display = 'none';

                console.log('Robot loaded:', Object.keys(robot.joints || {}));
            }, undefined, (err) => {
                console.error('URDF load error:', err);
                alert('Failed to load robot: ' + err.message);
            });
        }

        window.updateImageCount = function() {
            const input = document.getElementById('refImages');
            const count = document.getElementById('imageCount');
            const n = input.files.length;
            count.textContent = n ? `${n} image${n > 1 ? 's' : ''} selected` : '';
        };

        buildStageBar();
    </script>
</body>
